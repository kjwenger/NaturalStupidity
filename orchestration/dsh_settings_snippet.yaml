# Merge into ~/.dsh/settings.yaml
# (DSH's real schema — verified: llm-pi-ai.providers dict + agent-default-model.)
#
# Each route needs all four of: api, baseURL, a non-empty models list, and unique
# model ids inside it — DSH refuses the section at load time if any are missing.
# Model ids must match your server's /v1/models output character-for-character.

llm-pi-ai:
  providers:
    strix:
      displayName: Strix Halo (heavy)
      apiKeyEnv: STRIX_API_KEY        # export STRIX_API_KEY=local  (any non-empty value)
      api: openai-completions
      baseURL: http://strix-halo.local:8080/v1
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        - id: qwen2.5-72b-instruct     # must match server's reported id exactly
          name: Qwen2.5 72B
          contextWindow: 65536
          maxTokens: 8192

    mac:
      displayName: Mac Mini (mid)
      apiKeyEnv: MAC_API_KEY
      api: openai-completions
      baseURL: http://mac-mini.local:8080/v1
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        - id: qwen2.5-14b-instruct-4bit
          name: Qwen2.5 14B (MLX)
          contextWindow: 32768
          maxTokens: 4096

    laptop:
      displayName: MSI Laptop (fast)
      apiKeyEnv: LAPTOP_API_KEY
      api: openai-completions
      baseURL: http://msi-laptop.local:8080/v1
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        - id: llama-3.1-8b-instruct-q4
          name: Llama 3.1 8B Q4
          contextWindow: 16384
          maxTokens: 2048

agent-default-model:
  provider: strix
  model: qwen2.5-72b-instruct

# Before first run, export a placeholder credential for each route — local servers
# don't check it, but DSH refuses to send the request if apiKeyEnv resolves to nothing:
#   export STRIX_API_KEY=local MAC_API_KEY=local LAPTOP_API_KEY=local

# Sub-agent delegation (DSH's more dynamic option): DSH can wire other harnesses or
# tool-callable endpoints in as plugin sub-agents, so the orchestrating model can
# choose at runtime to delegate a subtask (e.g. a quick lookup) to the mac/laptop
# route instead of doing it itself. That plugin-wiring syntax is still moving in
# this developer preview — check the current DSH plugins docs before building on it:
# https://github.com/NousResearch/hermes-agent  (for Hermes) is stable; for DSH,
# check the dsh repo's docs/ directory at whatever version you've installed.
